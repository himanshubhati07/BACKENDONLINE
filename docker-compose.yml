services:
  db:
    image: postgres:15.10
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: gen_53cbec77f35a
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d gen_53cbec77f35a"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  app:
    build: .
    ports:
      - "25518:25518"
    environment:
      DATABASE_URL: postgresql+asyncpg://myuser:mypassword@db:5432/gen_53cbec77f35a
      ADMIN_API_KEY: ${ADMIN_API_KEY:-gA-D3AWbajgYDiX4BoFtcZq0hW6CrnhNS2yuXegcYbY}
      API_PREFIX: /api/v1
      PROJECT_NAME: Task Management API
      PROJECT_VERSION: 0.1.0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TASK_EVENTS_TOPIC: task-events
      PORT: 25518
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  db_data:
  kafka_data:
