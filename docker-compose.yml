services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gen_d1e3b211c8e2
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      SERVER_PORT: 29353
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gen_d1e3b211c8e2
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: mypassword
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
    ports:
      - "29353:29353"
    depends_on:
      mysql:
        condition: service_healthy
