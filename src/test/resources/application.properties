# Test configuration — supplies the required JWT_SECRET so the application
# context can boot during `mvn test` (JwtUtil refuses to start without one).
# Points at the SAME MongoDB instance/database the app ships against by default.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/gen_e8ea1cb1f5b0}
spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET:test-only-signing-secret-do-not-use-in-production-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION:1800000}

app.cors.allowed-origins=http://localhost:3000

springdoc.swagger-ui.enabled=true

management.endpoints.web.exposure.include=health,info
