spring.application.name=app

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/gen_e8ea1cb1f5b0}
# Ensure @Indexed annotations (e.g. the unique index on User.email) are actually created in MongoDB,
# so duplicate-email races are rejected by the database itself, not only by the application pre-check.
spring.data.mongodb.auto-index-creation=true

# Server
server.port=22916
server.forward-headers-strategy=framework

# JWT
# No default literal on purpose: the application must fail to start if JWT_SECRET is not provided.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION:1800000}

# CORS - explicit allow-list, no wildcard origins (required when allowCredentials=true)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.example.app=INFO
