server.port=${SERVER_PORT:23006}
server.shutdown=graceful
server.forward-headers-strategy=framework
spring.application.name=user-management-service
spring.datasource.url=jdbc:mysql://localhost:3306/gen_7c11ddcd7a3b
spring.datasource.username=${MYSQL_USER:myuser}
spring.datasource.password=${MYSQL_PASSWORD:mypassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.flyway.enabled=true
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
app.secret.api-key=${API_KEY:}
app.secret.admin-api-key=${ADMIN_API_KEY:}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSX} %-5level [%X{requestId}] %logger{36} - %msg%n
